name: S.H.I.E.L.D. Deployment Protection & CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deployment-protection:
    name: Deployment Gate & Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout S.H.I.E.L.D. Tactical Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Security & Install Dependencies
        run: npm ci

      - name: TypeScript Static Code Analysis
        run: npx tsc --noEmit

      - name: Build Production Production Artifacts
        run: npm run build

      - name: Deployment Gate Verification
        run: |
          echo "S.H.I.E.L.D. Deployment Protection Checks Passed."
          echo "Integrity: VERIFIED"
          echo "Security Gate: CLEARED"
